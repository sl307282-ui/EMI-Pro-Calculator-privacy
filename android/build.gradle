// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Redirect build outputs to a path without colons to avoid javac classpath splitting bugs
def customBuildDir = new File(System.getProperty("user.home"), ".gradle/builds/EMICalculator/root")
layout.buildDirectory.set(customBuildDir)

subprojects {
    def projectBuildDir = new File(System.getProperty("user.home"), ".gradle/builds/EMICalculator/${project.name}")
    layout.buildDirectory.set(projectBuildDir)

    afterEvaluate { project ->
        if (project.plugins.hasPlugin('com.android.library')) {
            project.tasks.withType(JavaCompile).configureEach { task ->
                if (project.tasks.findByName("generateDebugRFile")) {
                    task.dependsOn("generateDebugRFile")
                }
                if (project.tasks.findByName("generateReleaseRFile")) {
                    task.dependsOn("generateReleaseRFile")
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
